---
- name: Deploy app
  hosts: solyto
  vars_files:
    - ../inventory/production/group_vars/app.yml
  tasks:
    - name: Ensure deploy directory exists
      file:
        path: "{{ target_base_path }}/{{ app_path }}"
        state: directory
        owner: "{{ deploy_user }}"

    - name: Ensure node directory exists
      file:
        path: "{{ target_base_path }}/{{ app_path }}/node"
        state: directory
        owner: "{{ deploy_user }}"

    - name: Copy .env
      template:
        src: "{{ playbook_dir }}/../templates/app/.env.j2"
        dest: "{{ target_base_path }}/{{ app_path }}/.env"
        owner: "{{ deploy_user }}"
        mode: "0600"

    - name: Copy docker setup
      template:
        src: "{{ playbook_dir }}/../templates/app/{{ item.src }}"
        dest: "{{ target_base_path }}/{{ app_path }}/{{ item.dest }}"
        owner: "{{ deploy_user }}"
      loop:
        - { src: "compose.yml.j2",     dest: "compose.yml" }
        - { src: "node/Dockerfile.j2", dest: "node/Dockerfile" }

    - name: Remove old source
      shell: "rm -rf {{ target_base_path }}/{{ app_path }}/{{ src_path }}/"

    - name: Ensure src directory exists
      file:
        path: "{{ target_base_path }}/{{ app_path }}/{{ src_path }}"
        state: directory
        owner: "{{ deploy_user }}"

    # Deploys what git tracks at HEAD, not the working tree: untracked and
    # ignored files (shell history, editor/agent folders, .git) never leave
    # this machine, and uncommitted changes are not deployed (see
    # docs/backlog/rsync-copies-local-files.md).
    - name: Copy new source (git HEAD)
      block:
        - name: Check for uncommitted changes
          shell: "git -C {{ local_project_root }}/{{ app_path }} status --porcelain"
          delegate_to: localhost
          run_once: true
          changed_when: false
          register: git_status

        - name: Warn about uncommitted changes, they are not deployed
          debug:
            msg: "Not deployed (uncommitted): {{ git_status.stdout_lines }}"
          when: git_status.stdout | length > 0
          run_once: true

        - name: Create a temporary directory for the source
          tempfile:
            state: directory
            suffix: -app-src
          delegate_to: localhost
          run_once: true
          register: source_tmp

        - name: Extract HEAD into the temporary directory
          shell: "set -o pipefail && git -C {{ local_project_root }}/{{ app_path }} archive --format=tar HEAD | tar -x -C {{ source_tmp.path }}"
          args:
            executable: /bin/bash
          delegate_to: localhost
          run_once: true

        - name: Copy the source
          synchronize:
            src: "{{ source_tmp.path }}/"
            dest: "{{ target_base_path }}/{{ app_path }}/{{ src_path }}/"
            rsync_opts:
              - "--exclude=node_modules --exclude=.env --exclude=build"
              - "--chown={{ deploy_user }}:{{ deploy_user }}"
      always:
        - name: Remove the temporary directory
          file:
            path: "{{ source_tmp.path }}"
            state: absent
          delegate_to: localhost
          run_once: true
          when: source_tmp.path is defined

    - name: Build images
      shell: "cd {{ target_base_path }}/{{ app_path }} && docker compose build"
      register: docker_build

    - name: Print build output
      debug:
        msg: "{{ docker_build.stdout_lines }}"

    - name: Restart Docker
      shell: "cd {{ target_base_path }}/{{ app_path }} && docker compose up -d --remove-orphans"
      register: docker_restart
