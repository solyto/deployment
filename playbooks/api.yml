---
- name: Deploy api
  hosts: solyto
  vars_files:
    - ../inventory/production/group_vars/api.yml
  tasks:
    - name: Ensure api docker network exists
      shell: docker network create api || true

    - name: Ensure deploy directory exists
      file:
        path: "{{ target_base_path }}/{{ api_path }}"
        state: directory
        owner: "{{ deploy_user }}"

    - name: Ensure secrets directory exists
      file:
        path: "{{ target_base_path }}/{{ api_path }}/{{ secrets_path }}"
        state: directory
        owner: "{{ deploy_user }}"
        mode: "0700"

    - name: Ensure nginx directory exists
      file:
        path: "{{ target_base_path }}/{{ api_path }}/nginx"
        state: directory
        owner: "{{ deploy_user }}"

    - name: Ensure php directory exists
      file:
        path: "{{ target_base_path }}/{{ api_path }}/php"
        state: directory
        owner: "{{ deploy_user }}"

    - name: Copy .env
      template:
        src: "{{ playbook_dir }}/../templates/api/.env.j2"
        dest: "{{ target_base_path }}/{{ api_path }}/.env"
        owner: "{{ deploy_user }}"
        mode: "0600"

    - name: Copy docker setup
      template:
        src: "{{ playbook_dir }}/../templates/api/{{ item.src }}"
        dest: "{{ target_base_path }}/{{ api_path }}/{{ item.dest }}"
        owner: "{{ deploy_user }}"
      loop:
        - { src: "compose.yml.j2",              dest: "compose.yml" }
        - { src: "Makefile.j2",                 dest: "Makefile" }
        - { src: "nginx/api.conf.template.j2",  dest: "nginx/api.conf.template" }
        - { src: "nginx/Dockerfile.j2",         dest: "nginx/Dockerfile" }
        - { src: "php/app.php.ini.j2",          dest: "php/app.php.ini" }
        - { src: "php/dav.php.ini.j2",          dest: "php/dav.php.ini" }
        - { src: "php/queue.php.ini.j2",        dest: "php/queue.php.ini" }
        - { src: "php/Dockerfile.j2",           dest: "php/Dockerfile" }
        - { src: "php/startup.sh.j2",           dest: "php/startup.sh" }

    - name: Remove old source
      shell: "rm -rf {{ target_base_path }}/{{ api_path }}/{{ src_path }}/"

    - name: Ensure src directory exists
      file:
        path: "{{ target_base_path }}/{{ api_path }}/{{ src_path }}"
        state: directory
        owner: "{{ deploy_user }}"

    # Deploys what git tracks at HEAD, not the working tree: untracked and
    # ignored files (shell history, editor/agent folders, .git) never leave
    # this machine, and uncommitted changes are not deployed (see
    # docs/backlog/rsync-copies-local-files.md).
    - name: Copy new source (git HEAD)
      block:
        - name: Check for uncommitted changes
          shell: "git -C {{ local_project_root }}/{{ api_path }} status --porcelain"
          delegate_to: localhost
          run_once: true
          changed_when: false
          register: git_status

        - name: Warn about uncommitted changes, they are not deployed
          debug:
            msg: "Not deployed (uncommitted): {{ git_status.stdout_lines }}"
          when: git_status.stdout | length > 0
          run_once: true

        - name: Create a temporary directory for the source
          tempfile:
            state: directory
            suffix: -api-src
          delegate_to: localhost
          run_once: true
          register: source_tmp

        - name: Extract HEAD into the temporary directory
          shell: "set -o pipefail && git -C {{ local_project_root }}/{{ api_path }} archive --format=tar HEAD | tar -x -C {{ source_tmp.path }}"
          args:
            executable: /bin/bash
          delegate_to: localhost
          run_once: true

        - name: Copy the source
          synchronize:
            src: "{{ source_tmp.path }}/"
            dest: "{{ target_base_path }}/{{ api_path }}/{{ src_path }}/"
            rsync_opts:
              - "--exclude=*.sqlite --exclude=/vendor --exclude=/storage --exclude=.env --exclude=.git --exclude=/tests --exclude=docs/node_modules"
              - "--chown={{ deploy_user }}:{{ deploy_user }}"
      always:
        - name: Remove the temporary directory
          file:
            path: "{{ source_tmp.path }}"
            state: absent
          delegate_to: localhost
          run_once: true
          when: source_tmp.path is defined

    - name: Build images
      shell: "cd {{ target_base_path }}/{{ api_path }} && docker compose build"
      register: docker_build

    - name: Print build output
      debug:
        msg: "{{ docker_build.stdout_lines }}"

    - name: Restart Docker
      shell: "cd {{ target_base_path }}/{{ api_path }} && docker compose up -d --remove-orphans"
      register: docker_restart

    - name: Init Laravel
      shell: "docker exec -t {{ api_php_container }} sh /var/www/startup.sh"
      register: laravel

    - name: Print Laravel init output
      debug:
        msg: "{{ laravel.stdout_lines }}"
